<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flappy Combat: Sky Assault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK (v10 모듈) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, limit, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Demo Firebase Config (본인의 Firebase 프로젝트 설정으로 교체 가능)
    const firebaseConfig = {
      apiKey: "AIzaSyD-DemoKeyForFlappyCombat2026",
      authDomain: "angry-birds-fortress-game.firebaseapp.com",
      projectId: "angry-birds-fortress-game",
      storageBucket: "angry-birds-fortress-game.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:flappycombat"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.dbOps = { collection, addDoc, query, orderBy, limit, getDocs, serverTimestamp };
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      touch-action: manipulation;
      user-select: none;
      overflow: hidden;
    }
    #gameCanvas {
      display: block;
      margin: 0 auto;
      background: linear-gradient(to bottom, #1e293b, #0f172a);
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen text-white relative">

  <!-- HUD Upper UI -->
  <div class="absolute top-4 left-4 right-4 flex justify-between items-center z-10 pointer-events-none max-w-lg mx-auto">
    <div class="bg-slate-800/80 backdrop-blur border border-slate-700 px-4 py-2 rounded-xl">
      <span class="text-xs text-slate-400 block font-bold">SCORE</span>
      <span id="scoreDisplay" class="text-2xl font-black text-amber-400">0</span>
    </div>
    <button onclick="openLeaderboard()" class="pointer-events-auto bg-amber-500 hover:bg-amber-600 active:scale-95 text-slate-900 font-extrabold px-4 py-2.5 rounded-xl shadow-lg transition flex items-center gap-2 text-sm">
      🏆 리더보드
    </button>
  </div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas" width="400" height="600" class="rounded-2xl shadow-2xl border border-slate-800"></canvas>

  <!-- Start Overlay -->
  <div id="startOverlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center z-20">
    <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500 mb-2">FLAPPY COMBAT</h1>
    <p class="text-slate-400 text-sm mb-6">스페이스바 또는 화면 터치로 비행하세요!</p>
    <button onclick="startGame()" class="bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 active:scale-95 text-slate-950 font-black px-8 py-3 rounded-2xl text-lg shadow-xl transition transform">
      게임 시작 🚀
    </button>
  </div>

  <!-- Game Over & Score Submit Modal -->
  <div id="gameOverModal" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center z-30 p-4">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl w-full max-w-xs text-center shadow-2xl">
      <h2 class="text-2xl font-black text-red-500 mb-1">GAME OVER</h2>
      <p class="text-slate-400 text-xs mb-4">비행기가 격추되었습니다!</p>
      
      <div class="bg-slate-800/60 rounded-2xl p-4 mb-5 border border-slate-700/50">
        <span class="text-xs text-slate-400 block font-semibold mb-1">최종 점수</span>
        <span id="finalScore" class="text-4xl font-black text-amber-400">0</span>
      </div>

      <div class="mb-4 text-left">
        <label class="text-xs text-slate-400 block mb-1 font-bold pl-1">조종사 닉네임</label>
        <input type="text" id="nicknameInput" maxlength="10" placeholder="닉네임 입력" class="w-full bg-slate-800 border border-slate-700 text-white px-3 py-2.5 rounded-xl focus:outline-none focus:border-amber-500 text-sm">
      </div>

      <div class="flex flex-col gap-2">
        <button onclick="submitScoreAndShow()" class="w-full bg-amber-500 hover:bg-amber-600 active:scale-95 text-slate-950 font-bold py-2.5 rounded-xl shadow transition text-sm">
          점수 등록 & 리더보드 보기
        </button>
        <button onclick="restartGame()" class="w-full bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 font-bold py-2.5 rounded-xl transition text-sm">
          다시 도전하기
        </button>
      </div>
    </div>
  </div>

  <!-- Leaderboard Modal -->
  <div id="leaderboardModal" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center z-40 p-4">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl w-full max-w-sm text-center shadow-2xl flex flex-col max-h-[80vh]">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-black text-amber-400 flex items-center gap-2">
          <span>🏆</span> GLOBAL TOP 10
        </h2>
        <button onclick="closeLeaderboard()" class="text-slate-400 hover:text-white text-xl font-bold p-1">✕</button>
      </div>

      <div class="overflow-y-auto flex-1 my-2 pr-1">
        <ul id="leaderboardList" class="flex flex-col gap-2 text-sm text-left">
          <li class="bg-slate-800/50 p-3 rounded-xl text-slate-400 text-center">점수를 불러오는 중...</li>
        </ul>
      </div>

      <button onclick="closeLeaderboard()" class="mt-4 w-full bg-slate-800 hover:bg-slate-700 active:scale-95 text-white font-bold py-2.5 rounded-xl transition text-sm">
        닫기
      </button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Game Variables
    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let score = 0;
    let frames = 0;

    // Player Plane
    const plane = {
      x: 80,
      y: 250,
      width: 34,
      height: 24,
      gravity: 0.35,
      lift: -6.5,
      velocity: 0,
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        let angle = Math.min(Math.max(this.velocity * 0.05, -0.5), 0.5);
        ctx.rotate(angle);

        // Plane Body
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.ellipse(0, 0, 16, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        // Wing
        ctx.fillStyle = '#d97706';
        ctx.fillRect(-6, -2, 12, 14);

        // Cockpit
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(4, -3, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      },
      flap() {
        this.velocity = this.lift;
      },
      update() {
        this.velocity += this.gravity;
        this.y += this.velocity;

        if (this.y + this.height / 2 >= canvas.height) {
          this.y = canvas.height - this.height / 2;
          triggerGameOver();
        }
        if (this.y - this.height / 2 <= 0) {
          this.y = this.height / 2;
          this.velocity = 0;
        }
      },
      reset() {
        this.y = 250;
        this.velocity = 0;
      }
    };

    // Obstacles (Pipes/Towers)
    const obstacleArray = [];
    const obstacleWidth = 52;
    const obstacleGap = 150;

    function handleObstacles() {
      if (frames % 100 === 0) {
        const topHeight = Math.floor(Math.random() * (canvas.height - obstacleGap - 120)) + 40;
        obstacleArray.push({
          x: canvas.width,
          top: topHeight,
          bottom: canvas.height - topHeight - obstacleGap,
          passed: false
        });
      }

      for (let i = 0; i < obstacleArray.length; i++) {
        let obs = obstacleArray[i];
        obs.x -= 2.5;

        // Draw Top Tower
        ctx.fillStyle = '#334155';
        ctx.fillRect(obs.x, 0, obstacleWidth, obs.top);
        ctx.fillStyle = '#475569';
        ctx.fillRect(obs.x - 3, obs.top - 16, obstacleWidth + 6, 16);

        // Draw Bottom Tower
        ctx.fillStyle = '#334155';
        ctx.fillRect(obs.x, canvas.height - obs.bottom, obstacleWidth, obs.bottom);
        ctx.fillStyle = '#475569';
        ctx.fillRect(obs.x - 3, canvas.height - obs.bottom, obstacleWidth + 6, 16);

        // Collision Check
        if (
          plane.x + plane.width / 2 > obs.x &&
          plane.x - plane.width / 2 < obs.x + obstacleWidth &&
          (plane.y - plane.height / 2 < obs.top || plane.y + plane.height / 2 > canvas.height - obs.bottom)
        ) {
          triggerGameOver();
        }

        // Score Update
        if (obs.x + obstacleWidth < plane.x && !obs.passed) {
          obs.passed = true;
          score += 10;
          document.getElementById('scoreDisplay').innerText = score;
        }
      }

      while (obstacleArray.length > 0 && obstacleArray[0].x < -obstacleWidth) {
        obstacleArray.shift();
      }
    }

    // Input Controls
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        if (gameState === 'PLAYING') plane.flap();
      }
    });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (gameState === 'PLAYING') plane.flap();
    });

    canvas.addEventListener('mousedown', () => {
      if (gameState === 'PLAYING') plane.flap();
    });

    // Game Functions
    function startGame() {
      gameState = 'PLAYING';
      score = 0;
      frames = 0;
      obstacleArray.length = 0;
      plane.reset();
      document.getElementById('scoreDisplay').innerText = score;
      document.getElementById('startOverlay').classList.add('hidden');
      document.getElementById('gameOverModal').classList.add('hidden');
      loop();
    }

    function triggerGameOver() {
      if (gameState === 'GAMEOVER') return;
      gameState = 'GAMEOVER';
      document.getElementById('finalScore').innerText = score;
      document.getElementById('gameOverModal').classList.remove('hidden');
    }

    function restartGame() {
      startGame();
    }

    function loop() {
      if (gameState !== 'PLAYING') return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Background Stars FX
      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      for (let i = 0; i < 20; i++) {
        let sx = (i * 37 + frames * 0.5) % canvas.width;
        let sy = (i * 97) % canvas.height;
        ctx.fillRect(sx, sy, 2, 2);
      }

      handleObstacles();
      plane.update();
      plane.draw();

      frames++;
      requestAnimationFrame(loop);
    }

    // Firebase Leaderboard Integration Functions
    async function saveScoreToLeaderboard(nickname, finalScore) {
      if (!window.db || !window.dbOps) return;
      try {
        const { collection, addDoc, serverTimestamp } = window.dbOps;
        await addDoc(collection(window.db, "flappy_scores"), {
          nickname: nickname || "익명 조종사",
          score: Number(finalScore),
          createdAt: serverTimestamp()
        });
      } catch (error) {
        console.error("점수 등록 에러:", error);
      }
    }

    async function openLeaderboard() {
      const modal = document.getElementById("leaderboardModal");
      const listEl = document.getElementById("leaderboardList");
      modal.classList.remove("hidden");
      listEl.innerHTML = `<li class="bg-slate-800/50 p-3 rounded-xl text-slate-400 text-center">점수를 불러오는 중...</li>`;

      try {
        const { collection, query, orderBy, limit, getDocs } = window.dbOps;
        const q = query(collection(window.db, "flappy_scores"), orderBy("score", "desc"), limit(10));
        const querySnapshot = await getDocs(q);

        listEl.innerHTML = "";
        if (querySnapshot.empty) {
          listEl.innerHTML = `<li class="bg-slate-800/50 p-3 rounded-xl text-slate-400 text-center">등록된 기록이 없습니다.</li>`;
          return;
        }

        let rank = 1;
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const li = document.createElement("li");
          
          let medal = rank === 1 ? '🥇 ' : rank === 2 ? '🥈 ' : rank === 3 ? '🥉 ' : `${rank}. `;
          
          li.className = "bg-slate-800/80 p-3 rounded-xl border border-slate-700/60 flex justify-between items-center";
          li.innerHTML = `
            <div class="flex items-center gap-2">
              <span class="font-bold ${rank <= 3 ? 'text-amber-400' : 'text-slate-400'}">${medal}</span>
              <span class="font-semibold text-white">${data.nickname}</span>
            </div>
            <span class="font-black text-amber-400">${data.score}점</span>
          `;
          listEl.appendChild(li);
          rank++;
        });
      } catch (error) {
        console.error("리더보드 조회 오류:", error);
        listEl.innerHTML = `<li class="bg-slate-800/50 p-3 rounded-xl text-red-400 text-center">기록을 불러오지 못했습니다.</li>`;
      }
    }

    async function submitScoreAndShow() {
      const nickname = document.getElementById('nicknameInput').value.trim() || '익명';
      await saveScoreToLeaderboard(nickname, score);
      document.getElementById('gameOverModal').classList.add('hidden');
      openLeaderboard();
    }

    function closeLeaderboard() {
      document.getElementById("leaderboardModal").classList.add("hidden");
    }

    // Canvas Background Initial Render
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  </script>
</body>
</html>
